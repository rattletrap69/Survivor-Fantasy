    <!-- Tailwind CSS with Dark Mode Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        survivor: ['Bebas Neue', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Light Mode Default Background */
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(circle at 10% 20%, #f1f5f9 0%, #e2e8f0 90%);
        }
        
        /* Dark Mode Background */
        .dark body {
            background-color: #0f172a; 
            background-image: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(20, 30, 48) 90%);
        }

        .font-survivor { 
            letter-spacing: 0.05em; 
        }

        /* Glassmorphism that adapts to theme */
        .glass-card { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05); 
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .fire-text { 
            color: #f59e0b; 
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.4); 
        }
        
        /* Custom Animations */
        @keyframes flicker {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .animate-fire { animation: flicker 1.5s infinite alternate; }
        
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-bounce-short { animation: bounce-short 0.3s ease-in-out; }
        
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        
        /* Click Ripple & Splash Screen Animations */
        @keyframes ripple-effect {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }
        .click-ripple {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.8) 0%, rgba(245, 158, 11, 0) 70%);
            pointer-events: none;
            width: 40px;
            height: 40px;
            animation: ripple-effect 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 9999;
            mix-blend-mode: screen;
        }

        .dark .click-ripple {
            background: radial-gradient(circle, rgba(245, 158, 11, 0.8) 0%, rgba(245, 158, 11, 0) 70%);
        }

        @keyframes splash-flame {
            0% { transform: scale(1) rotate(-2deg); filter: blur(2px) brightness(1); }
            50% { transform: scale(1.1) rotate(2deg); filter: blur(0px) brightness(1.3); }
            100% { transform: scale(1) rotate(-2deg); filter: blur(2px) brightness(1); }
        }
        .splash-flame-anim { animation: splash-flame 3s infinite ease-in-out; }
        
        .pb-safe { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

        let firebaseConfig = null;
        let appId = 'survivor-fantasy-50';
        let initialToken = null;

        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) firebaseConfig = JSON.parse(__firebase_config);
            if (typeof __app_id !== 'undefined' && __app_id) appId = __app_id;
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) initialToken = __initial_auth_token;
        } catch (e) {
            console.warn("Firebase environment not found.");
        }

        if (!firebaseConfig) {
            // TEMPORARY FOR REAL MODE - Add your GitHub Pages Firebase credentials here
            firebaseConfig = {
                apiKey: "YOUR_API_KEY",
                authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
                projectId: "YOUR_PROJECT_ID",
                storageBucket: "YOUR_PROJECT_ID.appspot.com",
                messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
                appId: "YOUR_APP_ID"
            };
        }

        let db, auth;

        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        
        const initAuth = async () => {
            try {
                if (initialToken) await signInWithCustomToken(auth, initialToken);
                else await signInAnonymously(auth);
            } catch (err) {
                console.error("Auth failed", err);
                showToast("Authentication Failed", "error");
            }
        };
        initAuth();
        
        onAuthStateChanged(auth, (user) => {
            if (!user) return;
            
            // Subscribe to the global meta document to track active seasons
            const globalMetaRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global_meta');
            state.unsubGlobalMeta = onSnapshot(globalMetaRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().activeSeasons) {
                    state.activeSeasons = docSnap.data().activeSeasons;
                    // Sort descending so newest seasons are first
                    state.activeSeasons.sort((a,b) => parseInt(b) - parseInt(a));
                } else {
                    state.activeSeasons = ['50'];
                    setDoc(globalMetaRef, { activeSeasons: ['50'] }, { merge: true });
                }
                render();
            });

            subscribeToSeason(state.currentSeason);
        });

        // ==========================================
        // MULTI-SEASON LOGIC
        // ==========================================
        function getSuffix(seasonNum) {
            return seasonNum === '50' ? '' : `_S${seasonNum}`;
        }

        function subscribeToSeason(seasonNum) {
            if (!auth || !auth.currentUser) return;

            if (state.unsubRoster) state.unsubRoster();
            if (state.unsubTeamNames) state.unsubTeamNames();
            if (state.unsubRules) state.unsubRules();
            if (state.unsubActions) state.unsubActions();

            const suffix = getSuffix(seasonNum);

            state.players = [];
            state.actions = [];
            
            const rosterRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'roster' + suffix);
            state.unsubRoster = onSnapshot(rosterRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().players) {
                    state.players = docSnap.data().players;
                } else {
                    state.players = generateGenericRoster(seasonNum);
                }
                render();
            }, (error) => console.error("Roster sync error:", error));

            const teamNamesRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'teamNames' + suffix);
            state.unsubTeamNames = onSnapshot(teamNamesRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().names) {
                    state.teamNames = docSnap.data().names;
                } else {
                    state.teamNames = { Ian: "Ian", Jess: "Jess", Britt: "Britt", Ken: "Ken" };
                }
                render();
            }, (error) => console.error("Team names sync error:", error));

            const rulesRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'rules' + suffix);
            state.unsubRules = onSnapshot(rulesRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().system) {
                    state.pointSystem = docSnap.data().system;
                } else {
                    state.pointSystem = JSON.parse(JSON.stringify(DEFAULT_POINT_SYSTEM));
                }
                render();
            }, (error) => console.error("Rules sync error:", error));

            const actionsRef = collection(db, 'artifacts', appId, 'public', 'data', 'actions' + suffix);
            state.unsubActions = onSnapshot(actionsRef, (snapshot) => {
                const fetchedActions = [];
                snapshot.forEach((doc) => fetchedActions.push({ id: doc.id, ...doc.data() }));
                fetchedActions.sort((a, b) => b.timestamp - a.timestamp);
                state.actions = fetchedActions;
                render();
            }, (error) => {
                console.error("Firestore error:", error);
                showToast("Error syncing live data.", "error");
            });
        }

        function activateNewSeason(seasonNum) {
            if (!state.activeSeasons.includes(seasonNum.toString())) {
                const newActive = [...state.activeSeasons, seasonNum.toString()];
                newActive.sort((a,b) => parseInt(b) - parseInt(a));
                state.activeSeasons = newActive;
                
                const globalMetaRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global_meta');
                setDoc(globalMetaRef, { activeSeasons: newActive }, { merge: true });
            }
            
            state.currentSeason = seasonNum.toString();
            state.showNewSeasonModal = false;
            state.showSeasonSwitcher = false;
            state.showSplash = false;
            subscribeToSeason(state.currentSeason);
            showToast(`Warping to Season ${seasonNum}...`);
            render();
        }

        // ==========================================
        // EVENT DELEGATION
        // ==========================================
        let audioCtx;
        function playDrumHit() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) { console.log("Audio not supported or restricted"); }
        }

        document.addEventListener('click', (e) => {
            const isModalClick = e.target.closest('#season-switcher-modal') || e.target.closest('#new-season-modal');
            const isIgnoredClick = e.target.closest('.no-ripple') || isModalClick;

            if (state.showSplash && !e.target.closest('.splash-interactive')) return; 
            
            if (!isIgnoredClick) {
                playDrumHit();
                const ripple = document.createElement('div');
                ripple.className = 'click-ripple';
                ripple.style.left = `${e.clientX}px`;
                ripple.style.top = `${e.clientY}px`;
                document.body.appendChild(ripple);
                setTimeout(() => ripple.remove(), 500);
            }

            // Theme Toggle
            if (e.target.closest('#theme-toggle-btn')) {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('survivorTheme', state.theme);
                if (state.theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                render();
                return;
            }

            // Season Multiverse Handlers
            if (e.target.closest('#open-season-switcher')) {
                state.showSeasonSwitcher = true; render();
            }
            if (e.target.closest('#close-season-switcher') || (e.target.id === 'season-switcher-backdrop')) {
                state.showSeasonSwitcher = false; render();
            }
            const switchSeasonBtn = e.target.closest('[data-switch-season]');
            if (switchSeasonBtn) {
                state.currentSeason = switchSeasonBtn.dataset.switchSeason;
                state.showSeasonSwitcher = false;
                state.showSplash = false;
                subscribeToSeason(state.currentSeason);
                showToast(`Warping to Season ${state.currentSeason}...`);
                render();
            }

            if (e.target.closest('#open-new-season-modal')) {
                state.showNewSeasonModal = true; state.showSeasonSwitcher = false; render();
            }
            if (e.target.closest('#close-new-season-modal') || (e.target.id === 'new-season-backdrop')) {
                state.showNewSeasonModal = false; render();
            }
            const activateSeasonBtn = e.target.closest('[data-activate-season]');
            if (activateSeasonBtn) {
                activateNewSeason(activateSeasonBtn.dataset.activateSeason);
            }

            // Tabs
            const tabBtn = e.target.closest('[data-tab]');
            if (tabBtn) {
                state.activeTab = tabBtn.dataset.tab;
                state.selectedTeam = null; 
                render();
            }
            
            const delBtn = e.target.closest('[data-delete-id]');
            if (delBtn) { state.deleteConfirmId = delBtn.dataset.deleteId; render(); }

            const playerRow = e.target.closest('[data-player-modal]');
            if (playerRow) { state.selectedPlayerForModal = playerRow.dataset.playerModal; render(); }
            
            if (e.target.closest('#close-player-modal') || e.target.id === 'player-modal-backdrop') {
                state.selectedPlayerForModal = null; render();
            }
            
            const teamCard = e.target.closest('[data-team-card]');
            if (teamCard) {
                state.selectedTeam = teamCard.dataset.teamCard;
                window.scrollTo(0, 0); render();
            }
            if (e.target.closest('#back-to-dashboard')) {
                state.selectedTeam = null; render();
            }
            
            if (e.target.closest('#cancel-delete-btn')) {
                state.deleteConfirmId = null; state.resetConfirm = false; render();
            }
            if (e.target.closest('#confirm-delete-btn')) {
                if (state.resetConfirm) executeGlobalReset();
                else executeDelete(state.deleteConfirmId);
            }
            
            if (e.target.closest('#save-roster-btn')) handleSaveRoster();
            if (e.target.closest('#add-player-btn')) handleAddPlayer();
            if (e.target.closest('#reset-season-btn')) {
                state.resetConfirm = true; state.deleteConfirmId = "all"; render();
            }

            if (e.target.closest('.add-rule-btn')) {
                syncRulesFromDOM();
                const cIdx = e.target.closest('.add-rule-btn').dataset.cidx;
                state.pointSystem[cIdx].actions.push({ name: "New Rule", points: 0 });
                render();
            }
            if (e.target.closest('.delete-rule-btn')) {
                syncRulesFromDOM();
                const btn = e.target.closest('.delete-rule-btn');
                state.pointSystem[btn.dataset.cidx].actions.splice(btn.dataset.aidx, 1);
                render();
            }
            if (e.target.closest('#save-rules-btn')) handleSaveRules();
            
            const editTeamBtn = e.target.closest('#edit-team-name-btn');
            if (editTeamBtn) { state.editingTeamId = editTeamBtn.dataset.team; render(); }
            if (e.target.closest('#cancel-team-name-btn')) { state.editingTeamId = null; render(); }
            const saveTeamBtn = e.target.closest('#save-team-name-btn');
            if (saveTeamBtn) handleSaveTeamName(saveTeamBtn.dataset.team);

            const triviaAnsBtn = e.target.closest('[data-trivia-ans]');
            if (triviaAnsBtn && state.trivia.status === 'playing') {
                state.trivia.selectedOption = parseInt(triviaAnsBtn.dataset.triviaAns);
                state.trivia.status = 'answered';
                if (state.trivia.selectedOption === TRIVIA_QUESTIONS[state.trivia.currentQ].answer) {
                    state.trivia.score += 1;
                    showToast("Immunity won! Correct answer.");
                } else showToast("Your torch has been snuffed. Incorrect.", "error");
                render();
            }
            if (e.target.closest('#next-trivia-btn')) {
                if (state.trivia.currentQ < TRIVIA_QUESTIONS.length - 1) {
                    state.trivia.currentQ += 1;
                    state.trivia.status = 'playing';
                    state.trivia.selectedOption = null;
                } else state.trivia.status = 'finished';
                render();
            }
            if (e.target.closest('#restart-trivia-btn')) {
                state.trivia = { currentQ: 0, score: 0, status: 'playing', selectedOption: null };
                render();
            }
        });

        document.addEventListener('change', (e) => {
            if (e.target.id === 'user-select') {
                state.currentUser = e.target.value;
                if (state.currentUser !== 'Jess' && state.activeTab === 'admin') state.activeTab = 'dashboard';
                render();
            }
            if (e.target.id === 'episode-select') state.selectedEpisode = e.target.value;
            if (e.target.id === 'player-select') state.selectedPlayer = e.target.value;
            if (e.target.id === 'category-select') {
                state.selectedCategory = e.target.value;
                state.selectedActionName = ''; 
                render();
            }
            if (e.target.id === 'action-select') state.selectedActionName = e.target.value;
        });

        document.addEventListener('submit', (e) => {
            if (e.target.id === 'log-form') { e.preventDefault(); handleAddAction(); }
        });

        // ==========================================
        // LOGIC FUNCTIONS
        // ==========================================
        function handleAddAction() {
            if (!state.selectedPlayer || !state.selectedCategory || !state.selectedActionName) {
                showToast("Please fill out all fields!", "error");
                return;
            }
            
            const cat = state.pointSystem.find(c => c.category === state.selectedCategory);
            const actionObj = cat.actions.find(a => a.name === state.selectedActionName);
            
            const newAction = {
                playerId: state.selectedPlayer,
                actionName: actionObj.name,
                points: actionObj.points,
                episode: parseInt(state.selectedEpisode),
                timestamp: Date.now(),
                loggedBy: state.currentUser
            };

            if (!auth.currentUser) return showToast("Waiting for secure connection...", "error");
            const suffix = getSuffix(state.currentSeason);
            const actionsRef = collection(db, 'artifacts', appId, 'public', 'data', 'actions' + suffix);
            addDoc(actionsRef, newAction).then(() => {
                showToast("The Tribe has spoken! Points saved.");
                resetForm();
            }).catch(e => { console.error(e); showToast("Error saving points", "error"); });
        }

        function resetForm() {
            state.selectedPlayer = ''; state.selectedCategory = ''; state.selectedActionName = '';
            render();
        }

        async function executeDelete(id) {
            const suffix = getSuffix(state.currentSeason);
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'actions' + suffix, id);
            try {
                await deleteDoc(docRef);
                showToast("Record successfully removed.");
                state.deleteConfirmId = null;
                render();
            } catch (e) { console.error(e); showToast("Failed to delete record.", "error"); }
        }

        function showToast(msg, type = 'success') {
            state.toast = { msg, type };
            render();
            setTimeout(() => {
                if (state.toast && state.toast.msg === msg) { state.toast = null; render(); }
            }, 3000);
        }

        function handleSaveRoster() {
            const inputs = document.querySelectorAll('.player-row');
            const newRoster = [];
            inputs.forEach(row => {
                newRoster.push({
                    id: row.dataset.id,
                    name: row.querySelector('.player-name').value,
                    team: row.querySelector('.player-team').value,
                    isMVP: row.querySelector('.player-mvp').checked,
                    status: row.querySelector('.player-status').value
                });
            });
            state.players = newRoster;
            
            const suffix = getSuffix(state.currentSeason);
            const rosterRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'roster' + suffix);
            setDoc(rosterRef, { players: newRoster }).then(() => showToast("Commish updates secured!")).catch(e => showToast("Failed to save roster", "error"));
        }

        function handleAddPlayer() {
            state.players.push({ id: `s${state.currentSeason}_p${Date.now()}`, name: "New Castaway", team: "Unassigned", isMVP: false, status: "Active" });
            render();
        }

        function syncRulesFromDOM() {
            const catInputs = document.querySelectorAll('.rule-cat-name');
            catInputs.forEach(input => state.pointSystem[input.dataset.cidx].category = input.value);

            const rows = document.querySelectorAll('.rule-row');
            state.pointSystem.forEach(cat => cat.actions = []);
            
            rows.forEach(row => {
                const cIdx = row.dataset.cidx;
                const name = row.querySelector('.rule-name').value;
                const points = parseInt(row.querySelector('.rule-points').value) || 0;
                state.pointSystem[cIdx].actions.push({ name, points });
            });
        }

        function handleSaveRules() {
            syncRulesFromDOM();
            const suffix = getSuffix(state.currentSeason);
            const rulesRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'rules' + suffix);
            setDoc(rulesRef, { system: state.pointSystem })
                .then(() => showToast(`Scoring rules updated for Season ${state.currentSeason}!`))
                .catch(e => showToast("Failed to save rules", "error"));
        }

        async function executeGlobalReset() {
            try {
                const suffix = getSuffix(state.currentSeason);
                const actionsRef = collection(db, 'artifacts', appId, 'public', 'data', 'actions' + suffix);
                const snapshot = await getDocs(actionsRef);
                const batch = writeBatch(db);
                snapshot.docs.forEach((doc) => batch.delete(doc.ref));
                await batch.commit();
                
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'roster' + suffix), { players: generateGenericRoster(state.currentSeason) });
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'teamNames' + suffix), { names: { Ian: "Ian", Jess: "Jess", Britt: "Britt", Ken: "Ken" } });
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'rules' + suffix), { system: JSON.parse(JSON.stringify(DEFAULT_POINT_SYSTEM)) });
                
                state.deleteConfirmId = null; state.resetConfirm = false;
                showToast(`Season ${state.currentSeason} has been Hard Reset.`);
            } catch (e) { showToast("Failed to reset season", "error"); }
        }

        function handleSaveTeamName(teamId) {
            const input = document.getElementById('team-name-input');
            if (!input || !input.value.trim()) return;
            state.teamNames[teamId] = input.value.trim();
            state.editingTeamId = null;

            const suffix = getSuffix(state.currentSeason);
            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'teamNames' + suffix), { names: state.teamNames }, { merge: true })
                .then(() => showToast("Team name updated!"))
                .catch(e => showToast("Failed to save team name", "error"));
        }

        // ==========================================
        // RENDERING VIEWS
        // ==========================================
        function render() {
            const appDiv = document.getElementById('app');

            if (state.showSplash) {
                appDiv.innerHTML = renderSplash() + (state.showNewSeasonModal ? renderNewSeasonModal() : ''); return;
            }

            const playerScores = {};
            state.players.forEach(p => playerScores[p.id] = 0);
            state.actions.forEach(a => { if (playerScores[a.playerId] !== undefined) playerScores[a.playerId] += a.points; });

            const teamScores = { Ian: 0, Jess: 0, Britt: 0, Ken: 0 };
            state.players.forEach(p => { if(teamScores[p.team] !== undefined) teamScores[p.team] += playerScores[p.id]; });

            const sortedTeams = Object.entries(teamScores).map(([team, score]) => ({ team, score })).sort((a, b) => b.score - a.score);

            appDiv.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-32 relative">
                    ${renderHeader()}
                    ${state.toast ? renderToast() : ''}
                    ${state.deleteConfirmId ? renderDeleteModal() : ''}
                    ${state.selectedPlayerForModal ? renderPlayerModal(playerScores) : ''}
                    ${state.showSeasonSwitcher ? renderSeasonSwitcherModal() : ''}
                    ${state.showNewSeasonModal ? renderNewSeasonModal() : ''}
                    
                    <main class="mt-8 animate-fade-in">
                        ${state.activeTab === 'dashboard' && !state.selectedTeam ? renderDashboard(sortedTeams, playerScores, teamScores) : ''}
                        ${state.activeTab === 'dashboard' && state.selectedTeam ? renderTeamDashboard(state.selectedTeam, playerScores, teamScores) : ''}
                        ${state.activeTab === 'log' ? renderLogPoints() : ''}
                        ${state.activeTab === 'feed' ? renderActivityFeed(playerScores) : ''}
                        ${state.activeTab === 'rules' ? renderRules() : ''}
                        ${state.activeTab === 'trivia' ? renderTrivia() : ''}
                        ${state.activeTab === 'tutorial' ? renderTutorial() : ''}
                        ${state.activeTab === 'admin' && state.currentUser === 'Jess' ? renderAdmin() : ''}
                    </main>
                </div>
                ${renderBottomNav()}
            `;
        }

        function renderHeader() {
            return `
                <header class="flex flex-col md:flex-row justify-between items-center gap-6 border-b border-slate-300 dark:border-slate-700/50 pb-6">
                    <div class="flex items-center gap-4">
                        <i class="fa-solid fa-fire-flame-curved text-5xl text-amber-500 animate-fire drop-shadow-lg"></i>
                        <div>
                            <h1 id="open-season-switcher" class="text-4xl md:text-5xl font-survivor tracking-widest text-slate-800 dark:text-white uppercase drop-shadow-sm dark:drop-shadow-md flex items-center gap-3 cursor-pointer group no-ripple">
                                Fantasy Survivor 
                                <span class="text-amber-500 flex items-center gap-2 group-hover:text-amber-400 transition-colors bg-amber-50 dark:bg-amber-900/20 px-3 py-1 rounded-xl">
                                    S${state.currentSeason} <i class="fa-solid fa-chevron-down text-[20px] mb-0.5"></i>
                                </span>
                            </h1>
                            <p class="text-sm font-semibold tracking-wide text-slate-500 dark:text-slate-400 uppercase mt-1">${getSeasonTitle(state.currentSeason)}</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-3 glass-card px-4 py-2 rounded-xl shadow-lg">
                            <i class="fa-solid fa-user-astronaut text-slate-500 dark:text-slate-400"></i>
                            <select id="user-select" class="bg-transparent text-amber-600 dark:text-amber-400 text-lg font-bold focus:outline-none cursor-pointer">
                                ${['Viewer', 'Ian', 'Jess', 'Britt', 'Ken'].map(u => {
                                    const displayName = (u !== 'Viewer' && state.teamNames[u] && state.teamNames[u] !== u) ? `${u} (${state.teamNames[u]})` : u;
                                    return `<option class="bg-white dark:bg-slate-800 text-slate-900 dark:text-white" value="${u}" ${state.currentUser === u ? 'selected' : ''}>${displayName}</option>`;
                                }).join('')}
                            </select>
                        </div>
                        <button id="theme-toggle-btn" class="glass-card w-12 h-12 rounded-xl shadow-lg flex items-center justify-center text-slate-500 hover:text-amber-500 dark:text-slate-400 dark:hover:text-amber-400 transition-colors" title="Toggle Light/Dark Theme">
                            <i class="fa-solid ${state.theme === 'dark' ? 'fa-sun' : 'fa-moon'} text-xl"></i>
                        </button>
                    </div>
                </header>
            `;
        }

        // --- NEW HUB MODALS ---
        function renderSeasonSwitcherModal() {
            return `
                <div id="season-switcher-backdrop" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 dark:bg-slate-900/80 backdrop-blur-md p-4 animate-fade-in no-ripple">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-2xl w-full shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden transform transition-all scale-100 p-6 relative flex flex-col max-h-[80vh]">
                        <button id="close-season-switcher" class="absolute top-4 right-4 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full w-8 h-8 flex items-center justify-center transition-colors z-10">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        
                        <h2 class="text-3xl font-survivor text-amber-500 mb-6 flex items-center gap-3 border-b border-slate-200 dark:border-slate-700 pb-4">
                            <i class="fa-solid fa-earth-americas"></i> The Multiverse Hub
                        </h2>
                        
                        <div class="overflow-y-auto pr-2 pb-4 flex-1">
                            <p class="text-slate-500 dark:text-slate-400 text-sm mb-4 font-bold uppercase tracking-widest">Your Active Expeditions</p>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                ${state.activeSeasons.map(s => `
                                    <button data-switch-season="${s}" class="text-left relative overflow-hidden rounded-xl border-2 ${state.currentSeason === s ? 'border-amber-500 bg-amber-50 dark:bg-amber-900/20' : 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 hover:border-amber-400 dark:hover:border-amber-500'} p-4 transition-all group flex items-center justify-between">
                                        <div>
                                            <div class="font-survivor text-2xl text-slate-800 dark:text-white tracking-wider group-hover:text-amber-600 dark:group-hover:text-amber-400 transition-colors">Season ${s}</div>
                                            <div class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">${getSeasonTitle(s)}</div>
                                        </div>
                                        ${state.currentSeason === s ? '<i class="fa-solid fa-thumbtack text-amber-500 text-xl"></i>' : '<i class="fa-solid fa-arrow-right text-slate-300 dark:text-slate-600 group-hover:text-amber-500 transition-colors"></i>'}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="mt-6 pt-6 border-t border-slate-200 dark:border-slate-700">
                            <button id="open-new-season-modal" class="w-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-white py-4 rounded-xl transition-all flex items-center justify-center gap-3 text-xl font-survivor tracking-widest border border-slate-300 dark:border-slate-600">
                                <i class="fa-solid fa-plus text-amber-500"></i> Start Historic Draft
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderNewSeasonModal() {
            // Generate list of inactive seasons 1-49
            const inactiveSeasons = [];
            for (let i = 49; i >= 1; i--) {
                if (!state.activeSeasons.includes(i.toString())) inactiveSeasons.push(i.toString());
            }

            return `
                <div id="new-season-backdrop" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 dark:bg-slate-900/80 backdrop-blur-md p-4 animate-fade-in no-ripple">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden transform transition-all scale-100 p-6 relative flex flex-col max-h-[80vh]">

            const teams = ["Ian", "Jess", "Britt", "Ken"];

        function renderTeamDashboard(teamName, playerScores, teamScores) {

                                    <input type="text" id="team-name-input" class="bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-3xl md:text-5xl font-survivor tracking-widest px-4 py-2 rounded-xl border border-amber-500 focus:outline-none w-full shadow-inner" value="${displayTeamName}">

                                </div>

                                <h2 class="text-4xl md:text-5xl font-survivor text-slate-800 dark:text-white tracking-widest flex items-center gap-4 flex-wrap">
                                    <span>${displayTeamName}</span>
                                    ${isOwner ? `<button id="edit-team-name-btn" data-team="${teamName}" class="text-sm bg-slate-200 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 hover:text-amber-600 dark:hover:text-amber-400 px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 hover:border-amber-400 dark:hover:border-amber-500/50 transition-all flex items-center gap-2 font-inter tracking-normal"><i class="fa-solid fa-pen"></i> Edit Name</button>` : ''}
                                </h2>
                            `}
                            <p class="text-slate-600 dark:text-slate-400 font-semibold mt-3 flex items-center gap-4">
                                <span><i class="fa-solid fa-users text-amber-500"></i> ${activeCount} / ${teamPlayers.length} Active</span>
                                <span><i class="fa-solid fa-trophy text-amber-500"></i> Rank: ${getRankOrdinal(teamName, teamScores)}</span>

                            <div class="text-6xl font-black fire-text leading-none">${teamScores[teamName]}</div>

                        <h3 class="text-2xl font-survivor text-amber-500 flex items-center gap-3 mb-4"><i class="fa-solid fa-id-card"></i> Official Roster</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            ${teamPlayers.map(p => `
                                <div data-player-modal="${p.id}" class="glass-card cursor-pointer p-4 rounded-xl border border-transparent hover:border-amber-500 transition-all ${p.status === 'Eliminated' ? 'opacity-50 grayscale hover:grayscale-0' : ''} group shadow-lg flex flex-col justify-between h-full">

                                                    ${p.name.substring(0,2).toUpperCase()}
                                                </div>

                                                ${p.status === 'Eliminated' ? '<div class="absolute -bottom-1 -right-1 bg-red-100 dark:bg-red-900 rounded-full p-1 border border-red-500"><i class="fa-solid fa-skull text-red-500 dark:text-red-400 text-xs"></i></div>' : ''}

                                                ${p.isMVP ? '<div class="text-[10px] text-amber-600 dark:text-amber-500 uppercase tracking-widest font-bold">Draft MVP</div>' : ''}
                                                ${p.status === 'Eliminated' ? '<div class="text-[10px] text-red-500 dark:text-red-400 uppercase tracking-widest font-bold">Eliminated</div>' : ''}

                                        <div class="text-3xl font-black ${playerScores[p.id] > 0 ? 'text-green-600 dark:text-green-400' : (playerScores[p.id] < 0 ? 'text-red-500 dark:text-red-400' : 'text-slate-400 dark:text-slate-500')}">${playerScores[p.id]}</div>

                            ` : teamActions.map(action => {
                                const player = state.players.find(p => p.id === action.playerId);
                                const isPositive = action.points > 0;
                                return `
                                    <div class="bg-white/50 dark:bg-slate-900/50 rounded-xl p-3 border-l-4 ${isPositive ? 'border-green-500' : 'border-red-500'} border border-slate-200 dark:border-slate-700">

                                            <span class="font-bold text-slate-800 dark:text-white text-sm">${player ? player.name : 'Unknown'}</span>
                                            <span class="font-black ${isPositive ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}">${isPositive ? '+' : ''}${action.points}</span>

                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        function getRankOrdinal(teamName, teamScores) {
            const sorted = Object.entries(teamScores).sort((a, b) => b[1] - a[1]);
            const rank = sorted.findIndex(s => s[0] === teamName) + 1;
            if (rank === 1) return "1st"; if (rank === 2) return "2nd"; if (rank === 3) return "3rd"; return "4th";
        }

        function renderLogPoints() {
            let html = `
            <div class="max-w-2xl mx-auto glass-card rounded-2xl p-6 lg:p-10 shadow-2xl">

                                <i class="fa-solid fa-user-check text-green-500"></i> ${state.currentUser}

                        </div>

                                <option value="" disabled ${!state.selectedPlayer ? 'selected' : ''}>-- Choose A Player --</option>

                            <select id="category-select" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl p-4 text-slate-900 dark:text-white font-semibold focus:outline-none focus:border-amber-500 shadow-inner appearance-none" required>
                                <option value="" disabled ${!state.selectedCategory ? 'selected' : ''}>-- Choose Category --</option>
                                ${state.pointSystem.map(c => `<option value="${c.category}" ${state.selectedCategory === c.category ? 'selected' : ''}>${c.category}</option>`).join('')}
                            </select>
                        </div>
            `;

            if (state.selectedCategory) {
                const cat = state.pointSystem.find(c => c.category === state.selectedCategory);
                html += `
                        <div class="animate-fade-in">
                            <label class="block text-xs font-bold uppercase tracking-widest text-amber-600 dark:text-amber-500 mb-2">Specific Action Achieved</label>
                            <select id="action-select" class="w-full bg-amber-50 dark:bg-slate-900 border-2 border-amber-400 dark:border-amber-500/50 rounded-xl p-4 text-slate-900 dark:text-white font-semibold focus:outline-none shadow-sm appearance-none" required>
                                <option value="" disabled ${!state.selectedActionName ? 'selected' : ''}>-- Choose Result --</option>
                                ${cat.actions.map(a => `<option value="${a.name}" ${state.selectedActionName === a.name ? 'selected' : ''}>${a.name} (${a.points > 0 ? '+'+a.points : a.points} pts)</option>`).join('')}
                            </select>
                        </div>
                `;
            }

            html += `
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-amber-600 to-orange-500 hover:from-amber-500 hover:to-orange-400 text-white py-5 rounded-xl transition-all transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-3 text-2xl font-survivor tracking-widest shadow-lg border border-amber-400">

                                    </div>
                                </div>

                                <div class="bg-slate-50 dark:bg-slate-800/40 rounded-xl p-4 border border-slate-200 dark:border-slate-700/50 hover:border-slate-300 transition-colors">
                                    <h4 class="text-[10px] text-slate-500 uppercase tracking-widest font-black mb-1">Survivor Resume</h4>
                                    <p class="text-slate-700 dark:text-slate-200 font-medium flex items-center gap-2"><i class="fa-solid fa-island-tropical text-amber-600"></i> ${bio.seasons}</p>
                                </div>
                                
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="bg-slate-50 dark:bg-slate-800/40 rounded-xl p-4 border border-slate-200 dark:border-slate-700/50 hover:border-slate-300 transition-colors">
                                        <h4 class="text-[10px] text-slate-500 uppercase tracking-widest font-black mb-1">Archetype</h4>
                                        <p class="text-amber-600 dark:text-amber-400 font-bold text-sm leading-tight">${bio.style}</p>
                                    </div>
                                    <div class="bg-slate-50 dark:bg-slate-800/40 rounded-xl p-4 border border-slate-200 dark:border-slate-700/50 hover:border-slate-300 transition-colors">
                                        <h4 class="text-[10px] text-slate-500 uppercase tracking-widest font-black mb-1">Key Traits</h4>
                                        <p class="text-emerald-600 dark:text-emerald-400 font-bold text-sm leading-tight">${bio.skills}</p>
                                    </div>
                                </div>

                                <div class="bg-slate-50 dark:bg-slate-800/40 rounded-xl p-4 border border-slate-200 dark:border-slate-700/50 hover:border-amber-500/30 transition-colors">
                                    <h4 class="text-[10px] text-slate-500 uppercase tracking-widest font-black mb-2 flex items-center gap-2">
                                        <i class="fa-solid fa-book-open text-slate-400"></i> Castaway Dossier
                                    </h4>
                                    <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed border-l-2 border-amber-500/50 pl-3">${bio.bio}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSplash() {
            return `
                <div class="fixed inset-0 bg-slate-50 dark:bg-[#0a0f1a] flex flex-col items-center justify-center z-50 p-6 overflow-hidden splash-interactive">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10 dark:opacity-5"></div>
                    <div class="absolute bottom-[-10%] left-1/2 transform -translate-x-1/2 w-[150vw] h-[60vh] bg-amber-400/20 dark:bg-amber-600/20 blur-[100px] rounded-[100%]"></div>
                    <div class="absolute bottom-[-20%] left-1/2 transform -translate-x-1/2 w-[100vw] h-[40vh] bg-red-400/20 dark:bg-red-600/30 blur-[80px] rounded-[100%]"></div>

                    <div class="relative z-10 flex flex-col items-center animate-fade-in text-center w-full max-w-4xl">
                        <div class="mb-4 relative">
                            <i class="fa-solid fa-fire text-[80px] md:text-[120px] text-amber-500 drop-shadow-[0_0_50px_rgba(245,158,11,0.6)] dark:drop-shadow-[0_0_50px_rgba(245,158,11,0.8)] splash-flame-anim"></i>
                            <i class="fa-solid fa-fire text-[50px] md:text-[80px] text-orange-400 absolute bottom-0 left-1/2 transform -translate-x-1/2 opacity-80 mix-blend-screen animate-pulse"></i>
                        </div>
                        
                        <h1 class="text-5xl md:text-7xl font-survivor tracking-widest text-slate-800 dark:text-white uppercase drop-shadow-md dark:drop-shadow-2xl mb-8">
                            Fantasy <span class="text-amber-500">Survivor</span>
                        </h1>
                        
                        <div class="w-full bg-white/40 dark:bg-slate-900/60 backdrop-blur-xl border border-slate-200 dark:border-slate-700 p-6 rounded-3xl shadow-2xl">
                            <h3 class="text-sm font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-4 text-left">Your Expeditions</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                ${state.activeSeasons.map(s => `
                                    <button data-switch-season="${s}" class="text-left relative overflow-hidden rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/80 hover:border-amber-500 dark:hover:border-amber-500 p-4 transition-all group no-ripple flex flex-col justify-between h-24">
                                        <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity"></div>
                                        <div>
                                            <div class="font-survivor text-2xl text-slate-800 dark:text-white tracking-wider group-hover:text-amber-600 dark:group-hover:text-amber-400 transition-colors">Season ${s}</div>
                                            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">${getSeasonTitle(s)}</div>
                                        </div>
                                        <div class="self-end text-slate-300 dark:text-slate-600 group-hover:text-amber-500 transition-colors"><i class="fa-solid fa-play"></i></div>
                                    </button>
                                `).join('')}
                                
                                <button id="open-new-season-modal" class="text-left relative rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-600 bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800/50 hover:border-amber-400 dark:hover:border-amber-500 p-4 transition-all group flex flex-col justify-center items-center h-24 no-ripple">
                                    <div class="text-slate-500 dark:text-slate-400 group-hover:text-amber-500 transition-colors text-center">
                                        <i class="fa-solid fa-plus text-xl mb-1 block"></i>
                                        <div class="text-[10px] font-bold uppercase tracking-widest">Start Draft</div>
                                    </div>
                                </button>
                            </div>
                        </div>

                        <p class="mt-8 text-slate-400 dark:text-slate-500 text-xs font-semibold uppercase tracking-widest opacity-60">Tap background to make fire</p>
                    </div>
                </div>
            `;
        }

        function renderTrivia() {
            if (state.trivia.status === 'finished') {
                const percent = Math.round((state.trivia.score / TRIVIA_QUESTIONS.length) * 100);
                let title = "Sole Survivor!"; let icon = "fa-trophy text-amber-500";
                if (percent < 50) { title = "First Boot..."; icon = "fa-fire-extinguisher text-slate-400 dark:text-slate-500"; }
                else if (percent < 80) { title = "Jury Member"; icon = "fa-gavel text-slate-400 dark:text-slate-300"; }

                return `
                    <div class="max-w-2xl mx-auto text-center animate-fade-in py-10">
                        <div class="glass-card rounded-3xl p-10 shadow-2xl border-t-4 border-amber-500 relative overflow-hidden">
                            <i class="fa-solid ${icon} text-8xl mb-6 drop-shadow-lg"></i>
                            <h2 class="text-5xl font-survivor text-slate-800 dark:text-white tracking-wider mb-2">${title}</h2>
                            <p class="text-xl text-slate-500 dark:text-slate-400 font-semibold mb-8">You scored ${state.trivia.score} out of ${TRIVIA_QUESTIONS.length}</p>
                            
                            <div class="w-full bg-slate-200 dark:bg-slate-900 rounded-full h-4 mb-8 border border-slate-300 dark:border-slate-700 overflow-hidden">
                                <div class="bg-gradient-to-r from-amber-600 to-amber-400 h-4 rounded-full" style="width: ${percent}%"></div>
                            </div>
                            
                            <button id="restart-trivia-btn" class="bg-amber-600 hover:bg-amber-500 text-white px-8 py-4 rounded-xl font-bold uppercase tracking-widest transition-colors shadow-lg shadow-amber-900/50">
                                Play Again
                            </button>
                        </div>
                    </div>
                `;
            }

            const q = TRIVIA_QUESTIONS[state.trivia.currentQ];
            const isAnswered = state.trivia.status === 'answered';

            return `
                <div class="max-w-3xl mx-auto animate-fade-in">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-survivor text-amber-500 flex items-center gap-3"><i class="fa-solid fa-puzzle-piece"></i> Super-Fan Trivia</h2>
                        <div class="bg-slate-100 dark:bg-slate-800 px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-600 font-bold text-amber-600 dark:text-amber-400 text-sm shadow-inner">
                            Question ${state.trivia.currentQ + 1} of ${TRIVIA_QUESTIONS.length}
                        </div>
                    </div>

                    <div class="glass-card rounded-3xl p-6 md:p-10 shadow-2xl border border-slate-200 dark:border-slate-700/50">
                        <h3 class="text-xl md:text-2xl font-bold text-slate-800 dark:text-white mb-8 leading-snug">${q.q}</h3>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                            ${q.options.map((opt, idx) => {
                                let btnClass = "bg-white dark:bg-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-700 border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300";
                                let icon = "";
                                if (isAnswered) {
                                    if (idx === q.answer) {
                                        btnClass = "bg-green-50 dark:bg-green-900/50 border-green-500 text-green-600 dark:text-green-400 ring-2 ring-green-500/50";
                                        icon = "<i class='fa-solid fa-check mr-2'></i>";
                                    } else if (idx === state.trivia.selectedOption) {
                                        btnClass = "bg-red-50 dark:bg-red-900/50 border-red-500 text-red-600 dark:text-red-400 opacity-50";
                                        icon = "<i class='fa-solid fa-xmark mr-2'></i>";
                                    } else btnClass = "bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400 dark:text-slate-500 opacity-50";
                                }
                                return `
                                    <button ${isAnswered ? 'disabled' : `data-trivia-ans="${idx}"`} class="p-4 rounded-xl border-2 text-left font-semibold transition-all shadow-md ${btnClass} flex items-center">
                                        <div class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-900 flex items-center justify-center mr-4 text-xs font-black border border-slate-200 dark:border-slate-700 opacity-70 shrink-0">
                                            ${['A', 'B', 'C', 'D'][idx]}
                                        </div><span>${icon}${opt}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        ${isAnswered ? `
                            <div class="bg-slate-50 dark:bg-slate-900/80 rounded-2xl p-6 border-l-4 ${state.trivia.selectedOption === q.answer ? 'border-green-500' : 'border-red-500'} animate-fade-in shadow-inner flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6">
                                <div><h4 class="text-[10px] text-slate-500 uppercase tracking-widest font-black mb-1">Survivor Lore</h4><p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">${q.lore}</p></div>
                                <button id="next-trivia-btn" class="shrink-0 bg-amber-600 hover:bg-amber-500 text-white px-6 py-3 rounded-xl font-bold uppercase tracking-widest transition-colors shadow-lg text-sm w-full sm:w-auto">
                                    Next <i class="fa-solid fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function renderTutorial() {
            return `
            <div class="max-w-4xl mx-auto animate-fade-in">
                <div class="mb-8">
                    <h2 class="text-3xl font-survivor text-amber-500 flex items-center gap-3 mb-2"><i class="fa-solid fa-map-location-dot"></i> Survival Guide</h2>
                    <p class="text-slate-500 dark:text-slate-400 text-sm">Everything you need to know to outwit, outplay, and outlast in your fantasy league.</p>
                </div>

                <!-- Player Guide -->
                <div class="glass-card rounded-2xl p-6 shadow-xl mb-8 border-l-4 border-l-emerald-500">
                    <h3 class="text-2xl font-survivor text-slate-800 dark:text-white tracking-wider mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-users text-emerald-500"></i> Castaway Basics
                    </h3>
                    <div class="space-y-4 text-slate-600 dark:text-slate-300 text-sm leading-relaxed">
                        <p><strong><i class="fa-solid fa-caret-right text-emerald-500 mr-1"></i> The Objective:</strong> Draft a team of castaways and earn points based on their actions during the episodes. The team with the most points at the end of the season wins.</p>
                        <p><strong><i class="fa-solid fa-caret-right text-emerald-500 mr-1"></i> Logging Points:</strong> Anyone can log points! Select your name from the top-right dropdown, head to the <strong>Log Points</strong> tab, choose the episode, the player, and the action they completed. Be honest—the Commish is watching!</p>
                        <p><strong><i class="fa-solid fa-caret-right text-emerald-500 mr-1"></i> Player Bios:</strong> Click on any player's name or avatar on the main Ranks page to open their Survivor dossier, showing their historical stats, playstyle, and total points.</p>
                        <p><strong><i class="fa-solid fa-caret-right text-emerald-500 mr-1"></i> Team Dashboards:</strong> Click on a specific team's rank card (e.g., "1st Place") on the main dashboard to view a dedicated breakdown of just their roster and point history.</p>
                    </div>
                </div>

                <!-- Commish Setup Guide (For Jess) -->
                <div class="glass-card rounded-2xl p-6 shadow-xl border-t-2 border-amber-500 bg-amber-50/50 dark:bg-amber-900/10">
                    <h3 class="text-2xl font-survivor text-slate-800 dark:text-white tracking-wider mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-user-shield text-amber-500"></i> Commish Playbook (Season Setup)
                    </h3>
                    <p class="text-slate-500 dark:text-slate-400 text-sm mb-6">Instructions for Jess on setting up new or historical seasons seamlessly (and spoiler-free!).</p>
                    
                    <div class="space-y-6">
                        <div class="flex items-start gap-4">
                            <div class="w-8 h-8 rounded-full bg-amber-500 text-slate-900 flex items-center justify-center font-bold shrink-0">1</div>
                            <div>
                                <h4 class="font-bold text-slate-800 dark:text-white mb-1">Create the Season Universe</h4>
                                <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">Use the dropdown menu at the very top next to "Fantasy Survivor" to select the season you want to play. Selecting a new season automatically generates a blank slate with empty rosters. <em class="text-amber-600 dark:text-amber-400 font-semibold">Tip: Do not google the season to look at the cast list if you don't want spoilers on who wins!</em></p>
                            </div>
                        </div>

                        <div class="flex items-start gap-4">
                            <div class="w-8 h-8 rounded-full bg-amber-500 text-slate-900 flex items-center justify-center font-bold shrink-0">2</div>
                            <div>
                                <h4 class="font-bold text-slate-800 dark:text-white mb-1">Set Up Your Friends' Teams</h4>
                                <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">By default, the newly created teams are generic. Make sure "Jess" is selected in the top-right user menu. Go to the <strong>Ranks</strong> tab, click into each generic team's dashboard card, and click the <i class="fa-solid fa-pen text-slate-400 mx-1"></i> <strong>Edit Name</strong> button to customize the tribe names for your friends.</p>
                            </div>
                        </div>

                        <div class="flex items-start gap-4">
                            <div class="w-8 h-8 rounded-full bg-amber-500 text-slate-900 flex items-center justify-center font-bold shrink-0">3</div>
                            <div>
                                <h4 class="font-bold text-slate-800 dark:text-white mb-1">Host Your Draft</h4>
                                <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">Watch episode 1 together, pause, and draft your teams offline (on paper or in a group chat). Pick your players and declare one player per team as the MVP.</p>
                            </div>
                        </div>

                        <div class="flex items-start gap-4">
                            <div class="w-8 h-8 rounded-full bg-amber-500 text-slate-900 flex items-center justify-center font-bold shrink-0">4</div>
                            <div>
                                <h4 class="font-bold text-slate-800 dark:text-white mb-1">Configure the Roster</h4>
                                <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">Go to the <strong>Commish</strong> tab at the bottom. Replace "Castaway 1", "Castaway 2", etc., with the actual names of the players you just drafted. Assign them to the correct friend's team, and check the box if they are an MVP. Hit <strong>Save All Roster Changes</strong> to publish the board to everyone's phones!</p>
                            </div>
                        </div>

                        <div class="flex items-start gap-4">
                            <div class="w-8 h-8 rounded-full bg-amber-500 text-slate-900 flex items-center justify-center font-bold shrink-0">5</div>
                            <div>
                                <h4 class="font-bold text-slate-800 dark:text-white mb-1">Weekly Eliminations & Rules</h4>
                                <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">After each episode, return to the <strong>Commish</strong> tab and change voted-out players' status from <em>Active</em> to <em>Eliminated</em>. Also, if you want to invent new point opportunities for a specific season (like "Found the Edge of Extinction map"), you can add them dynamically in the <strong>Custom Point System</strong> section on the Commish tab.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        render();
    </script>
</body>
</html>
